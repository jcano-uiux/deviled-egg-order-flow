<!-- ARCHIVE: the markup around the Distilled flavor picker (2026-10-16). The rows themselves are drawn by renderFlavorGrid() in distilled-picker.js. -->

<!-- In the item modal body: -->
          <div id="flavor-block">
            <div class="modal-section-head">
              <span class="modal-section-title" id="flavor-section-title">Choose your flavors</span>
              <span class="modal-section-sub" id="flavor-hint"></span>
            </div>
            <div class="flavor-grid" id="flavor-grid"></div>
          </div>

<!-- In the item modal footer (counter + progress): -->
      <div class="flavor-meter" id="flavor-meter">
        <span class="flavor-meter-count" id="flavor-count" aria-live="polite"></span>
        <div class="flavor-meter-bar" id="flavor-meter-bar" aria-hidden="true"></div>
      </div>
